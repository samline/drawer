name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build package
        run: bun run build

      - name: Test
        run: bun run test

      - name: Audit dependencies
        run: bun audit

      - name: Verify package exports and contents
        run: bun run test:package

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package for copied examples
        run: bun run build
      - name: Check both apps and design conventions
        run: bun run site:check
      - name: Check website formatting
        run: bun run site:format:check
      - name: Test website tooling
        run: bun run site:test
      - name: Test alternate package and deployment bases
        run: bun run site:test:adaptation
      - name: Build site and verify links and migration
        run: bun run site:build
      - name: Check release documentation evidence
        run: bun run site:check:release
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install isolated framework test dependencies
        run: npm install --prefix "$RUNNER_TEMP/drawer-frameworks" react@19.3.1 react-dom@19.3.1 vue@3.5.44 svelte@5.57.2 liquidjs@10.30.0 --ignore-scripts --no-audit --no-fund
      - name: Run full browser and copied example regressions
        env:
          DRAWER_FRAMEWORK_NODE_MODULES: ${{ runner.temp }}/drawer-frameworks/node_modules
        run: bun run site:test:browser
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
