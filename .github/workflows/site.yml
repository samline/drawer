# The website's own checks (not managed by the family template).
# pnpm installs, Bun runs the scripts.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - name: Build package for copied examples
        run: bun run build
      - name: Verify package exports and contents
        run: bun run test:package
      - name: Check both apps and design conventions
        run: bun run site:check
      - name: Check website formatting
        run: bun run site:format:check
      - name: Test website tooling
        run: bun run site:test
      - name: Test alternate package and deployment bases
        run: bun run site:test:adaptation
      - name: Build site and verify links and migration
        run: bun run site:build
      - name: Check release documentation evidence
        run: bun run site:check:release
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install isolated framework test dependencies
        # A flat node_modules outside the repository, as the framework fixtures expect.
        run: pnpm add --dir "$RUNNER_TEMP/drawer-frameworks" --config.node-linker=hoisted react@19.3.1 react-dom@19.3.1 vue@3.5.44 svelte@5.57.2 liquidjs@10.30.0
      - name: Run full browser and copied example regressions
        env:
          DRAWER_FRAMEWORK_NODE_MODULES: ${{ runner.temp }}/drawer-frameworks/node_modules
        run: bun run site:test:browser
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
