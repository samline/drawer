# Managed by package-landing-docs (family/templates/package). Edit there, then run node family/scripts/sync.mjs.
# pnpm settings for this package and its website (landing, docs, shared).

packages:
  - landing
  - docs
  - shared

# Fresh @samline releases install right away; every other version waits pnpm's
# minimumReleaseAge before it can be installed.
minimumReleaseAgeExclude:
  - '@samline/*'

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  esbuild: true

# Repository overrides (kept by sync): tsup still pulls esbuild 0.27, which has
# GHSA-g7r4-m6w7-qqqr.
overrides:
  esbuild: ^0.28.1

# picomatch <=4.0.7 (GHSA-fc5q-39xc-vjpf, ReDoS) reaches only the website build
# through astro > unstorage > anymatch and has no fixed release yet. Remove this
# once picomatch ships a fix and the lockfile picks it up.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
